[project]
name = "ckam-backend"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "sqlalchemy[asyncio]>=2.0",
  "asyncpg>=0.30",
  "psycopg2-binary>=2.9",
  "alembic>=1.14",
  "pydantic>=2.9",
  "pydantic-settings>=2.6",
  "argon2-cffi>=23.1",
  "python-jose[cryptography]>=3.3",
  "python-multipart>=0.0.12",
  "openpyxl>=3.1",
  "qrcode[pil]>=8.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "pytest-asyncio>=0.24", "httpx>=0.27", "pytest-cov>=6.0"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# The app's async engine (and its connection pool) is created once at import
# time in app.core.db. pytest-asyncio's default per-test event loop means a
# second async DB test reuses pooled asyncpg connections created under a
# different (already-closed) loop, failing with "attached to a different
# loop" on checkout (pool_pre_ping's ping). Running all tests in one shared
# event loop avoids that cross-loop pool reuse.
asyncio_default_test_loop_scope = "session"
