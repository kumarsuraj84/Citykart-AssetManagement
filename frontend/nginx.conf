# AU-14: the browser hardening policies, defined ONCE here (this file is included at the http level, so a
# `map` is allowed) and added below through variables -- nginx drops a server block's add_header lines in any
# location that sets its own, so every such location repeats the add_header lines; keeping the long values in
# one place stops those copies from drifting apart. The single-port production server (uvicorn) sends the
# identical Content-Security-Policy from the backend -- change both together.
#
# CSP notes: style-src needs 'unsafe-inline' (React `style=` attributes, Radix/sonner/recharts inject inline
# styles); fonts are the app's own files (FONTS: Inter / IBM Plex Mono are bundled, no Google host is allowed);
# img-src `blob:` for the QR / barcode pictures and `data:` for small inline SVGs. No 'unsafe-eval': zod runs
# with `jitless` (see src/lib/zod-config.ts) so nothing in the bundle evaluates strings.
# src/security/nginx-config.test.ts checks these hardening lines; scripts/check-nginx-live.mjs runs them.
map $host $ckam_csp {
    default "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self' data:; img-src 'self' data: blob:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'";
}
# No camera: the labels are read by USB/Bluetooth scanners that type like a keyboard, and a phone's own camera
# app opens a label's link -- this app never asks for the camera itself.
map $host $ckam_permissions_policy {
    default "camera=(), microphone=(), geolocation=(), payment=(), usb=()";
}

server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # AU-15: no nginx version in the Server header or on nginx's own error pages.
    server_tokens off;

    # nginx's default request-body limit is 1 MB, which rejected (413) document
    # uploads and Excel imports long before they reached the API's own 10 MB
    # document limit. 11m leaves headroom for multipart overhead above that.
    client_max_body_size 11m;

    # AM-10 (AM09-05): narrow, HTTPS-independent hardening headers. No HSTS
    # here -- meaningless and unsafe to send on this deployment's plain-HTTP
    # LAN model (see docs/ai/DECISIONS.md).
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Content-Security-Policy $ckam_csp always;
    add_header Permissions-Policy $ckam_permissions_policy always;

    # `^~`: an API path is never handed to the regex location for static files below (e.g. a future
    # /api/.../something.css), it always goes to the API.
    location ^~ /api/ {
        proxy_pass http://api:8000/api/;

        # Security N3: tell the API who really connected. OVERWRITE (never append to) X-Forwarded-For with the
        # address nginx itself saw, so a browser cannot smuggle in a made-up address; the API believes this
        # header only from nginx's own fixed address (TRUSTED_PROXIES in docker-compose.yml).
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Host $host;

        # nginx does not inherit a parent server block's add_header directives
        # into a location block that sets its own add_header -- repeat them
        # here (verified live: omitting this dropped all three on /api/*).
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Content-Security-Policy $ckam_csp always;
        add_header Permissions-Policy $ckam_permissions_policy always;
        # AM-10 (AM09-06): authenticated API JSON must never be cached by an
        # intermediate proxy or the browser's disk cache.
        add_header Cache-Control "no-store" always;
        # Security N5: the API sends these same headers itself (for single-port production); drop its copies
        # here so every response carries each header exactly once (nginx's copies above, with identical values).
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header X-Frame-Options;
        proxy_hide_header Referrer-Policy;
        proxy_hide_header Content-Security-Policy;
        proxy_hide_header Permissions-Policy;
        proxy_hide_header Cache-Control;

        # AU-15: an upload over client_max_body_size gets the app's usual JSON error (one plain sentence)
        # instead of nginx's HTML page, so the screen shows a sentence and not "Request failed: 413".
        error_page 413 = @too_large;
    }

    location @too_large {
        default_type application/json;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Content-Security-Policy $ckam_csp always;
        add_header Permissions-Policy $ckam_permissions_policy always;
        add_header Cache-Control "no-store" always;
        return 413 '{"detail":"The file is too large to upload. Choose a smaller file and try again."}';
    }

    # AM-14: the SPA shell itself must always be revalidated -- a hashed asset
    # filename changes on every build, but index.html's own filename never does,
    # so without this a browser can serve a stale cached index.html (referencing
    # deleted/renamed hashed asset files) after a redeploy until a hard reload.
    # `try_files $uri /index.html` below internally re-dispatches to this exact
    # location for every SPA route (verified live: this is what actually fixed
    # the stale-bundle repro, not just the literal /index.html URL). Hashed
    # files under /assets/ are served directly by their own locations below,
    # never reach this block, and keep their existing caching behavior.
    location = /index.html {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Content-Security-Policy $ckam_csp always;
        add_header Permissions-Policy $ckam_permissions_policy always;
    }

    # AU-12: source maps are never served, even if a build ever produced one.
    location ~* \.map$ {
        return 404;
    }

    # AU-12: a static file (script, stylesheet, font, picture) that does not exist is a plain 404 -- not the SPA
    # shell with a 200 (which is what made `/assets/index-*.js.map` look "reachable"). SPA routes such as
    # /assets/42 have no file extension and still fall through to `location /` below.
    location ~* \.(?:js|mjs|css|woff2?|ttf|otf|png|jpe?g|gif|svg|webp|ico)$ {
        try_files $uri =404;
    }

    location / {
        try_files $uri /index.html;
    }
}
