services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: ckam
      POSTGRES_USER: ckam
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ckam_dev_pw}
    volumes:
      - db_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ckam"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+asyncpg://ckam:${POSTGRES_PASSWORD:-ckam_dev_pw}@db:5432/ckam
      JWT_SECRET: ${JWT_SECRET:-dev_secret_change_me}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    volumes:
      - uploads:/data/uploads

  web:
    build: ./frontend
    depends_on:
      - api
    ports:
      - "3211:80"

  # NOTE on base image: the `db` service above uses `postgres:17`, which is
  # Debian-based and ships neither `apk` nor a cron daemon — an
  # `apk add ... || true` fallback there would silently no-op and the
  # nightly job would never actually run. `postgres:17-alpine` is used here
  # instead: it ships the *same* PostgreSQL 17.11 client tools (pg_dump/psql
  # match the server exactly) plus BusyBox `crond`, `tar` and `gzip`
  # out of the box, verified by running the image directly and confirming a
  # `* * * * *` crontab entry actually fired under `crond -f`. No package
  # install is required or attempted.
  backup:
    image: postgres:17-alpine
    entrypoint: >
      sh -c "echo '0 2 * * * /scripts/backup.sh >> /var/log/ckam-backup.log 2>&1' > /etc/crontabs/root;
             touch /var/log/ckam-backup.log;
             crond -f -l 2"
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD:-ckam_dev_pw}
    volumes:
      - ./ops/backup.sh:/scripts/backup.sh:ro
      - ./ops/restore.sh:/scripts/restore.sh:ro
      - uploads:/data/uploads
      - ${BACKUP_DIR:-./backups}:/backups
    depends_on:
      db:
        condition: service_healthy

volumes:
  db_data:
  uploads:
