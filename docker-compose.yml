services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: ckam
      POSTGRES_USER: ckam
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ckam_dev_pw}
    # S8: PostgreSQL's own log (docker compose logs db): statements slower than 500 ms, lock waits longer
    # than deadlock_timeout, checkpoints and big temporary files, each line prefixed with time, process,
    # role@database. The running dev database got the same settings through ALTER SYSTEM (no restart);
    # production equivalents: docs/ai/LOGGING_AND_DIAGNOSTICS.md.
    command:
      - postgres
      - -c
      - log_min_duration_statement=500
      - -c
      - log_lock_waits=on
      - -c
      - deadlock_timeout=1s
      - -c
      - log_checkpoints=on
      - -c
      - log_connections=off
      - -c
      - "log_line_prefix=%m [%p] %q%u@%d "
      - -c
      - log_temp_files=10MB
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./ops/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql:ro
    # Published on the host's loopback interface only: reachable from the server
    # itself (psql/pgAdmin for admin work) but NOT from other devices on the LAN.
    # To deliberately expose it, change to "${DB_PORT:-5432}:5432" (see
    # docs/deployment.md, "Ports").
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ckam"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Security IF-13: named volumes made by the older root-run image are owned by root, which the API (now uid
  # 10001, see backend/Dockerfile) could not write. This one-shot step hands only the two data volumes to uid
  # 10001 (files not already owned by it; data is never touched or deleted), then exits; the API starts only
  # after it succeeded. It is the ONLY part that runs as root, has no network, and keeps just the chown-related
  # capabilities, so the long-running API never needs root or any capability at all.
  volume-init:
    build:
      context: ./backend
      target: dev
    user: "0:0"
    entrypoint: ["sh", "-c", "find /data/uploads /data/logs \\( ! -user 10001 -o ! -group 10001 \\) -exec chown -h 10001:10001 {} + && echo 'volume-init: /data/uploads and /data/logs belong to uid 10001'"]
    network_mode: none
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_READ_SEARCH]
    security_opt: ["no-new-privileges:true"]
    restart: "no"
    volumes:
      - uploads:/data/uploads
      - logs:/data/logs

  api:
    # IF-13: the `dev` target (non-root, plus the test tooling CLAUDE.md's pytest command needs). The `runtime`
    # target has no pytest and no tests/ and is what a non-test deployment of this image should use.
    build:
      context: ./backend
      target: dev
    environment:
      DATABASE_URL: postgresql+asyncpg://ckam:${POSTGRES_PASSWORD:-ckam_dev_pw}@db:5432/ckam
      JWT_SECRET: ${JWT_SECRET:-dev_secret_change_me}
      # Public URL of the web app (nginx, port 3211) -- printed QR labels encode
      # ${BASE_URL}/assets/{id}. Must be the real LAN hostname/IP in production.
      BASE_URL: ${BASE_URL:-http://localhost:3211}
      # Secure attribute on the refresh-token cookie. Keep false for plain-HTTP LAN
      # use (browsers never send Secure cookies over HTTP); true behind HTTPS.
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      # Read-only link to the ERP data warehouse (POs, vendors). Leave empty to
      # switch the ERP screens off. The password is typed into .env, never here.
      PO_SOURCE_HOST: ${PO_SOURCE_HOST:-}
      PO_SOURCE_PORT: ${PO_SOURCE_PORT:-5432}
      PO_SOURCE_DB: ${PO_SOURCE_DB:-}
      PO_SOURCE_USER: ${PO_SOURCE_USER:-}
      PO_SOURCE_PASSWORD: ${PO_SOURCE_PASSWORD:-}
      # S8: JSON-lines logs (app.jsonl / error.jsonl / audit.jsonl, 20 MB x 10 each) in the `logs` volume.
      LOG_DIR: /data/logs
      ENVIRONMENT_NAME: ${ENVIRONMENT_NAME:-development}
      # Security N3: believe X-Forwarded-For ONLY from the nginx `web` container's fixed address (nginx overwrites
      # that header with the address it saw). Never a whole Docker range: a request from this PC to the
      # published API port arrives from a Docker gateway address and could then pick its own address.
      TRUSTED_PROXIES: ${CKAM_WEB_IP:-172.31.211.10}
    # IF-13: no Linux capabilities, no privilege gain (setuid binaries), non-root user from the image. The
    # process can write only /data/uploads, /data/logs and /tmp. The root filesystem is NOT mounted read-only
    # here on purpose: `docker compose cp backend/app/. api:/app/app/` (the code-sync step used before running
    # pytest) needs it; the runtime target does run with read_only (see docs/security/evidence/closure/infra/).
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    # CL2-IF-OBS-01: the two world-writable scratch folders are memory-only and nothing in them can be run
    # (noexec, nosuid, nodev). Python's tempfile, upload spooling, the test-log folder and pytest's tmp_path use
    # /tmp; nothing executes from it (checked with the WP-F suite subset on a throw-away container). /dev/shm is
    # already noexec/nosuid/nodev by Docker's default. Note: `docker compose cp` INTO /tmp does not work on a tmpfs
    # (the file lands hidden underneath) -- copy test inputs into /app, as the pytest code-sync already does.
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev
      - /var/tmp:rw,noexec,nosuid,nodev
    networks:
      - default
      - edge
    depends_on:
      db:
        condition: service_healthy
      volume-init:
        condition: service_completed_successfully
    # Loopback only, like `db`: LAN users go through nginx on the web port, which
    # is the one entry point with the upload-size limit etc. Direct API access
    # from the host (curl, /docs) still works on 127.0.0.1.
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    volumes:
      - uploads:/data/uploads
      - logs:/data/logs

  web:
    build: ./frontend
    depends_on:
      - api
    ports:
      - "${WEB_PORT:-3211}:80"
    # Security N3: nginx sits ONLY on the small `edge` network, at a fixed address the API trusts
    # (TRUSTED_PROXIES above), so every request it forwards comes from exactly that address.
    networks:
      edge:
        ipv4_address: ${CKAM_WEB_IP:-172.31.211.10}

  # NOTE on base image: the `db` service above uses `postgres:17`, which is
  # Debian-based and ships neither `apk` nor a cron daemon — an
  # `apk add ... || true` fallback there would silently no-op and the
  # nightly job would never actually run. `postgres:17-alpine` is used here
  # instead: it ships the *same* PostgreSQL 17.11 client tools (pg_dump/psql
  # match the server exactly) plus BusyBox `crond`, `tar` and `gzip`
  # out of the box, verified by running the image directly and confirming a
  # `* * * * *` crontab entry actually fired under `crond -f`. No package
  # install is required or attempted.
  backup:
    image: postgres:17-alpine
    entrypoint: >
      sh -c "echo '0 2 * * * /scripts/backup.sh >> /var/log/ckam-backup.log 2>&1' > /etc/crontabs/root;
             touch /var/log/ckam-backup.log;
             crond -f -l 2"
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD:-ckam_dev_pw}
    volumes:
      - ./ops/backup.sh:/scripts/backup.sh:ro
      - ./ops/restore.sh:/scripts/restore.sh:ro
      - uploads:/data/uploads
      - ${BACKUP_DIR:-./backups}:/backups
    depends_on:
      db:
        condition: service_healthy

networks:
  # Security N3: web <-> api only, on a fixed subnet so nginx can have a fixed address. Every compose project
  # that runs AT THE SAME TIME as another one from this file (e.g. -p ckam-uat, -p ckam-sec next to the dev
  # stack) must set its own CKAM_EDGE_SUBNET and CKAM_WEB_IP in its env file (e.g. 172.31.212.0/28 and
  # 172.31.212.10); otherwise Docker refuses to start it ("Pool overlaps with other one on this address space").
  edge:
    ipam:
      config:
        - subnet: ${CKAM_EDGE_SUBNET:-172.31.211.0/28}

volumes:
  db_data:
  uploads:
  logs:
