# WP-F throw-away stand-in for the API (CL2-IF-03 live check): answers like the app, with its own X-Request-ID.
server {
    listen 8000;
    location = /api/health {
        default_type application/json;
        add_header X-Request-ID app-request-id-0001 always;
        return 200 '{"status":"ok"}';
    }
    location /api/ {
        default_type application/json;
        add_header X-Request-ID app-request-id-0404 always;
        return 404 '{"detail":"no such API address"}';
    }
}
