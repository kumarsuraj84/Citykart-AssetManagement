# Perf comparison (ckam-pf-new): identical DB settings to ckam-pf-old, plus pg_stat_statements for statement counts
# and the built frontend served by uvicorn from /tmp/dist (to time the /assets/* static route + IF-01 lexical check).
# RATE_LIMIT_ENABLED=false for the throughput runs (as scratchpad/sec/uat-override.yml); the rate-limited sign-in
# run recreates the api WITHOUT this override line (new-override-rl.yml).
services:
  db:
    command:
      - postgres
      - -c
      - log_min_duration_statement=500
      - -c
      - log_lock_waits=on
      - -c
      - deadlock_timeout=1s
      - -c
      - log_checkpoints=on
      - -c
      - log_connections=off
      - -c
      - "log_line_prefix=%m [%p] %q%u@%d "
      - -c
      - log_temp_files=10MB
      - -c
      - shared_preload_libraries=pg_stat_statements
      - -c
      - pg_stat_statements.track=top
  api:
    environment:
      FRONTEND_DIST_DIR: /tmp/dist
      RATE_LIMIT_ENABLED: "false"
