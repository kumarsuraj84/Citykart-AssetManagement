# Perf comparison (ckam-pf-old): identical DB settings to ckam-pf-new, plus pg_stat_statements for statement counts
# and the built frontend served by uvicorn from /tmp/dist (to time the /assets/* static route).
services:
  db:
    command:
      - postgres
      - -c
      - log_min_duration_statement=500
      - -c
      - log_lock_waits=on
      - -c
      - deadlock_timeout=1s
      - -c
      - log_checkpoints=on
      - -c
      - log_connections=off
      - -c
      - "log_line_prefix=%m [%p] %q%u@%d "
      - -c
      - log_temp_files=10MB
      - -c
      - shared_preload_libraries=pg_stat_statements
      - -c
      - pg_stat_statements.track=top
  api:
    environment:
      FRONTEND_DIST_DIR: /tmp/dist
